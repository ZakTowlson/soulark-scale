<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Soul Ark Scale — Command Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1126;--panel:#131B38;--panel2:#1A2347;--line:rgba(255,255,255,.08);--line2:rgba(202,163,28,.4);
  --gold:#CAA31C;--gold2:#E6C458;--text:#F2F0E8;--muted:#A0A9C6;--dim:#6F789A;
  --good:#43C08A;--warn:#F2A93B;--bad:#EE6262;--blue:#6E94F2;
  --r:14px;--sans:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--head:'Poppins',var(--sans);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--head);font-weight:600;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:#0E1530;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 22px}
.mono{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font:600 13px var(--head);color:var(--gold);flex:none}
.brand b{display:block;font:600 14px var(--head);line-height:1.2}
.brand small{color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;background:none;border:0;border-left:2px solid transparent;border-radius:0 8px 8px 0;padding:9px 12px;color:var(--muted);text-align:left;font-weight:600;font-size:13.5px}
.nav button:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav button.on{color:var(--gold2);background:rgba(202,163,28,.09);border-left-color:var(--gold)}
.nav svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:0 7px;min-width:20px;text-align:center}
.nav .badge.gold{background:var(--gold);color:#1a1400}
.sidefoot{margin-top:auto;padding:16px 10px 0;border-top:1px solid var(--line)}
.sidefoot small{color:var(--dim);display:block;margin-bottom:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.sidefoot b{font:600 15px var(--head)}
.main{padding:30px 34px 70px;max-width:1360px;width:100%;min-width:0}
.grid>*,.stack>*,.cgrid>*{min-width:0}
.card{overflow-wrap:break-word;overflow-x:auto}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:26px;line-height:1.2}
.top p{color:var(--muted);margin-top:3px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--gold);color:#1a1400;border:0;border-radius:10px;padding:9px 16px;font-weight:700;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--gold2)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:600}
.btn.ghost:hover{border-color:var(--line2);background:rgba(202,163,28,.07)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(238,98,98,.4)}
.btn.good{background:var(--good);color:#04180f}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card h2{font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card h2 small{font:500 12px var(--sans);color:var(--dim)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;text-align:left;display:block;width:100%}
button.kpi:hover{border-color:var(--line2)}
.kpi .l{font-size:11.5px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;font-weight:700}
.kpi .v{font:600 26px var(--head);margin:4px 0 2px;letter-spacing:-.02em}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.alert{border-color:rgba(238,98,98,.45);background:linear-gradient(180deg,rgba(238,98,98,.09),var(--panel))}
.kpi.alert .v{color:#FF8B8B}
.bar{height:6px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:6px}
.bar i.g{background:var(--good)}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row b{font-weight:700}
.sub{color:var(--muted);font-size:12.5px}
.val{font:600 14px var(--head);color:var(--gold2);white-space:nowrap}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:1px 9px;background:rgba(255,255,255,.08);color:var(--muted);vertical-align:1px;white-space:nowrap}
.chip[data-s=replied]{background:rgba(110,148,242,.1);color:#B4C6FB}
.chip[data-s=prospect]{background:rgba(110,148,242,.22);color:#9DB6FA}
.chip[data-s=convo]{background:rgba(110,148,242,.16);color:#9DB6FA}
.chip[data-s=booked]{background:rgba(167,139,250,.16);color:#C4B2FC}
.chip[data-s=decide]{background:rgba(202,163,28,.18);color:var(--gold2)}
.chip[data-s=won],.chip.good{background:rgba(67,192,138,.16);color:#6FD9A9}
.chip[data-s=lost],.chip.bad{background:rgba(238,98,98,.16);color:#FF8B8B}
.chip.warn{background:rgba(242,169,59,.16);color:#F7C071}
.empty{color:var(--dim);padding:14px 0;text-align:center}
.banner{background:rgba(202,163,28,.1);border:1px solid var(--line2);border-radius:12px;padding:11px 16px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--gold2)}
/* forms */
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld>span{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.03em}
input,select,textarea{background:#0E1530;border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;outline:none;color-scheme:dark}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input[type=checkbox]{width:auto;accent-color:var(--gold);width:17px;height:17px}
textarea{resize:vertical;min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;align-items:center;gap:9px;margin:4px 0 12px;font-weight:600;color:var(--muted)}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline input,.inline select{width:auto;flex:1;min-width:120px}
.inline input[name=title]{flex:3;min-width:200px}
/* checkbox round */
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--dim);background:none;flex:none;display:grid;place-items:center;color:transparent;padding:0}
.tick:hover{border-color:var(--gold)}
.tick.done{background:var(--good);border-color:var(--good);color:#04180f}
.tick svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.done-t{text-decoration:line-through;color:var(--dim)}
.pri{width:8px;height:8px;border-radius:50%;flex:none}
.x{background:none;border:0;color:var(--dim);font-size:20px;line-height:1;padding:2px 6px}
.x:hover{color:var(--bad)}
.sec{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:18px 0 4px;display:flex;gap:8px;align-items:center}
.sec:first-child{margin-top:0}
.sec.bad{color:#FF8B8B}.sec.gold{color:var(--gold2)}
/* kanban */
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px;align-items:start}
.kcol{background:#0F1630;border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:200px}
.kcol.over{border-color:var(--gold);background:rgba(202,163,28,.06)}
.khead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;padding:0 2px}
.khead b{font:600 13px var(--head)}
.khead small{color:var(--muted);font-size:12px;font-weight:600}
.lcard{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px;cursor:grab}
.lcard:hover{border-color:var(--line2)}
.lcard.stuck{border-left:3px solid var(--bad)}
.lcard.due{border:1px solid rgba(238,98,98,.7);border-left:4px solid var(--bad);background:rgba(238,98,98,.12)}
.lcard.soon{border:1px solid rgba(242,169,59,.5);border-left:4px solid var(--warn);background:rgba(242,169,59,.07)}
.lcard .a .ch.go{background:var(--good);color:#06281a}
.lcard .a .ch.go:hover{background:#5fd3a0;color:#06281a}
.chase-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(238,98,98,.1);border:1px solid rgba(238,98,98,.45);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.chase-bar.ok{background:rgba(67,192,138,.08);border-color:rgba(67,192,138,.35);color:var(--muted);font-weight:500}
.lcard.dragging{opacity:.4}
.lcard .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.lcard .t b{min-width:0;overflow-wrap:anywhere}
.lcard .t .val,.lcard .t .sub{flex:none}
.lcard .sub{overflow-wrap:anywhere}
.lcard .m{margin:7px 0 2px;display:flex;gap:5px;flex-wrap:wrap}
.lcard .a{display:flex;gap:6px;margin-top:9px}
.lcard .a button{background:rgba(255,255,255,.06);border:0;border-radius:7px;padding:3px 10px;font-size:12px;font-weight:700;color:var(--muted)}
.lcard .a button:hover{background:rgba(202,163,28,.2);color:var(--gold2)}
.lcard .a .ch{flex:1}
/* client */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr));gap:14px}
.weeks{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:12px 0 6px}
.weeks i{height:7px;border-radius:4px;background:rgba(255,255,255,.1)}
.weeks i.d{background:var(--gold)}.weeks i.n{background:var(--gold2);box-shadow:0 0 0 2px rgba(202,163,28,.3)}
/* score */
.sc{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.sc:first-of-type{border-top:0}
.sc .n{font:600 18px var(--head);min-width:70px;text-align:center}
.sc .n small{color:var(--dim);font-size:12px;font-weight:500}
.sc button.pm{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--text);font-size:16px;font-weight:700}
.sc button.pm:hover{border-color:var(--gold);color:var(--gold2)}
.sc .grow{flex:1}
.mini{display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:6px}
.mini div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:10.5px;color:var(--dim)}
.mini i{width:100%;max-width:26px;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px;display:block}
.mini i.lo{background:rgba(202,163,28,.4)}
/* charts */
.chart{position:relative;display:flex;align-items:flex-end;gap:14px;height:210px;padding:26px 6px 0;border-bottom:1px solid var(--line)}
.chart .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;position:relative;z-index:1}
.chart .col i{width:100%;max-width:64px;background:var(--gold);border-radius:6px 6px 0 0;display:block;min-height:2px}
.chart .col.cur i{background:var(--gold2)}
.chart .col b{font:600 12px var(--head);color:var(--text)}
.chart .tl{position:absolute;left:0;right:0;border-top:1.5px dashed rgba(255,255,255,.35);z-index:0}
.chart .tl span{position:absolute;right:0;top:-19px;font-size:11px;color:var(--muted);background:var(--panel);padding:0 4px}
.xl{display:flex;gap:14px;padding:6px 6px 0;color:var(--muted);font-size:12px;font-weight:600}
.xl span{flex:1;text-align:center}
.funnel .f{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center;padding:7px 0}
.funnel .f .bar{margin:0;height:22px;border-radius:6px}
.funnel .f .bar i{border-radius:6px}
.funnel .rate{color:var(--muted);font-size:12px;padding:0 0 0 162px;margin-top:-3px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;padding:6px 8px;font-weight:700}
td{padding:10px 8px;border-top:1px solid var(--line)}
td.r,th.r{text-align:right}
.rd{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:center;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.rd:first-of-type{border-top:0}
.ico{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px;font-weight:800;background:rgba(255,255,255,.08);color:var(--dim)}
.ico.ok{background:var(--good);color:#04180f}
.phase{border:1px solid var(--line);border-radius:12px;padding:14px 16px;flex:1;min-width:230px}
.phase.cur{border-color:var(--line2);background:rgba(202,163,28,.07)}
.phase small{color:var(--gold2);font-weight:800;letter-spacing:.08em;font-size:11px;text-transform:uppercase}
.story{background:linear-gradient(135deg,rgba(202,163,28,.14),rgba(202,163,28,.03));border:1px solid var(--line2);border-radius:var(--r);padding:20px 24px;margin-bottom:16px;font:500 17px/1.55 var(--head)}
.story em{font-style:normal;color:var(--gold2);font-weight:700}
.tmpl{border-top:1px solid var(--line);padding:11px 0}
.tmpl:first-of-type{border-top:0}
.tmpl p{color:var(--muted);font-size:13px;margin:3px 0 7px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 14px;font-weight:700;font-size:12.5px;color:var(--muted)}
.seg button.on{background:rgba(202,163,28,.18);color:var(--gold2)}
/* modal / toast */
#modal .mback{position:fixed;inset:0;background:rgba(3,6,18,.72);z-index:50;display:grid;place-items:center;padding:16px;overflow-y:auto}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:22px 24px;width:100%;max-width:500px;max-height:94vh;overflow-y:auto}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.mhead h3{font-size:18px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.mfoot .l{margin-right:auto}
#toast{position:fixed;bottom:22px;left:50%;width:max-content;text-align:center;transform:translateX(-50%) translateY(30px);background:var(--gold);color:#1a1400;font-weight:700;padding:10px 20px;border-radius:30px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.saved{margin-top:12px;font-size:11.5px;font-weight:700;color:var(--good)}
.saved.bad{color:var(--bad)}
.gnum{font:700 72px/1 var(--head);color:var(--gold2);letter-spacing:-.03em;margin:6px 0 2px}
.gnum.warn{color:var(--warn)}.gnum.bad{color:#FF8B8B}
.glabel{color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.gtitle{font:600 17px/1.35 var(--head);margin:14px 0 4px}
.ident{background:linear-gradient(135deg,rgba(202,163,28,.14),rgba(202,163,28,.03));border-color:var(--line2)}
.idtext{font:500 17px/1.7 var(--head);margin:4px 0 16px}
.idtext.fold{max-height:calc(1.7em * 3);overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.hbtns{display:flex;gap:6px;align-items:center}
.fbtn{min-width:34px}
.wkp{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:64px;padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);font-weight:700;font-size:13px;color:var(--muted)}
.wkp small{font-weight:600;font-size:11px;color:var(--dim)}
.wkp.on{border-color:var(--gold);background:rgba(202,163,28,.14);color:var(--gold2)}
.wkp.now{box-shadow:0 0 0 2px rgba(67,192,138,.45)}
.lad{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0 14px}
.lad .st{padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:600;font-size:13px}
.lad .st.end{background:rgba(202,163,28,.16);border-color:var(--gold);color:var(--gold2)}
.lad .ar{color:var(--dim)}
.scorerow{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.scorerow button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);font-weight:700;font-size:12px;padding:0}
.scorerow button:hover{border-color:var(--line2)}
.scorerow button.on[data-sv=lo]{background:rgba(238,98,98,.22);border-color:var(--bad);color:#FF9B9B}
.scorerow button.on[data-sv=mid]{background:rgba(242,169,59,.2);border-color:var(--warn);color:var(--warn)}
.scorerow button.on[data-sv=hi]{background:rgba(67,192,138,.2);border-color:var(--good);color:var(--good)}
.blist{margin:8px 0 0;padding-left:18px}.blist li{margin:7px 0;line-height:1.55}
.iq{border-left:3px solid var(--gold);padding:5px 12px;margin:9px 0;font-style:italic;line-height:1.5}
.persona{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
@media(max-width:640px){.persona{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ptag{font:600 19px/1.35 var(--head);margin:4px 0 10px}
.idea .hook{font-weight:600;line-height:1.45}
.snote{white-space:pre-wrap;margin-top:4px;line-height:1.55}
.qa label{display:block;font-weight:600;font-size:13.5px;margin:12px 0 5px}
.qa textarea{min-height:76px;font-size:14px;line-height:1.55}
.ident h2,.mission h2{flex-wrap:wrap;gap:8px}
.mission{border-color:var(--line2);background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(202,163,28,.08))}
.crow{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--panel2)}
.crow.today{border-color:var(--gold);background:rgba(202,163,28,.08)}
.crow.restday{opacity:.6}
.cday{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.cday b{font:600 16px var(--head)}
.cmain{display:flex;flex-direction:column;gap:5px;align-items:flex-start;min-width:0}
.cpiece .sub{display:inline-block;min-width:54px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:11px}
.cticks{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.ctick{border:1px solid var(--line);background:none;border-radius:9px;padding:6px 13px;font-weight:700;font-size:12.5px;color:var(--muted)}
.ctick:hover{border-color:var(--line2)}
.ctick.done{background:var(--good);border-color:var(--good);color:#04180f}
.sunbtn{background:none;border:1px solid var(--line);color:var(--dim);border-radius:7px;font-size:11px;font-weight:700;padding:2px 8px}
.sunbtn:hover{border-color:var(--line2)}
.sunbtn.on{background:rgba(202,163,28,.2);border-color:var(--line2);color:var(--gold2)}
.offrow{opacity:.55}
.grip{cursor:grab;color:var(--dim);font-size:20px;line-height:1;padding:0 2px;user-select:none;flex:none}
.nninput{width:100%;background:#0E1530;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:600}

const followerGuide = () => `<div class="card" style="margin-bottom:14px;background:rgba(202,163,28,.06);border-color:var(--line2)"><h2><span>Message new followers <span class="chip">Instagram + TikTok</span></span><span style="display:flex;gap:6px">${pipeGuide ? `<button class="btn sm ${pipeEdit ? '' : 'ghost'}" data-act="pipeEdit">${pipeEdit ? 'Done' : 'Edit'}</button>` : ''}<button class="btn sm ghost" data-act="pipeGuide">${pipeGuide ? 'Hide' : 'Show'}</button></span></h2>
  ${pipeGuide ? `<div class="sub" style="margin-bottom:8px">Followers should see this in their main inbox, so the photo comes through. Send both, one straight after the other.</div>
  ${[[1, 'Send a selfie with this caption', 0], [2, 'Then send this as a text message', 1]].map(([n, label, i]) => `<div class="row"><span class="nnnum" style="font-size:20px;align-self:flex-start">${n}</span><div class="grow"><b>${label}</b>${pipeEdit ? `<textarea data-tmpl="${i}" aria-label="${esc(TEMPLATES[i][0])}" style="margin-top:6px;min-height:${i === 0 ? 64 : 110}px">${esc(tmplText(i))}</textarea>` : `<div class="iq" style="font-style:normal">${esc(tmplText(i))}</div>`}</div>${pipeEdit ? (S.tmplEdits[TEMPLATES[i][0]] ? `<button class="btn sm ghost" data-act="tmplReset" data-i="${i}" title="Back to the original wording">Reset</button>` : '') : `<button class="btn sm" data-act="copyTmpl" data-i="${i}">Copy</button>`}</div>`).join('')}
  <div class="row"><span class="nnnum" style="font-size:20px;align-self:flex-start">3</span><div class="grow"><b>When they reply</b><div class="sub">Add them with + Lead (or drag the card) into <b>Replied to Me</b>. Next ask what they are working on, and only offer the webinar after they have told you something real.</div></div></div>` : ''}</div>`;
function vPipeline() {
  const open = openLeads();
  const chase = open.filter(l => chaseLevel(l) === 'due'), tmrw = open.filter(l => chaseLevel(l) === 'soon');
  const bar2 = chase.length ? `<div class="chase-bar">🔴 ${chase.length} ${chase.length === 1 ? 'person needs' : 'people need'} chasing now · ${gbp(sum(chase, 'value'))} waiting on you<span class="sub" style="font-weight:500">Red cards are at the top of each column. Hit <b>Chased</b> after you message them and they drop back for ${S.settings.gap} days.</span></div>`
    : `<div class="chase-bar ok">✓ Nobody needs chasing right now${tmrw.length ? ` · ${tmrw.length} due tomorrow` : ''}</div>`;
  const cols = STAGES.map(s => {
    let ls = S.leads.filter(l => l.stage === s.id && leadMatches(l));
    if (OPEN.includes(s.id)) ls.sort((a, b) => urgency(a).localeCompare(urgency(b)) || b.value - a.value);   // chase-now cards on top
    else ls = ls.sort((a, b) => b.history.slice(-1)[0].date.localeCompare(a.history.slice(-1)[0].date));
    const all = !!pipeAll[s.id] || !!pipeQ.trim(), shown = all ? ls : ls.slice(0, 12);
    return `<div class="kcol" data-stage="${s.id}"><div class="khead"><b>${s.label}</b><small>${ls.length} · ${gbp(sum(ls, 'value'))}</small></div>
      ${shown.map(l => card(l)).join('') || `<div class="sub" style="text-align:center;padding:14px 0">${pipeQ.trim() ? 'No match' : 'Empty'}</div>`}
      ${ls.length > 12 && !pipeQ.trim() ? `<button class="btn sm ghost" data-act="pipeMore" data-s="${s.id}" style="width:100%;margin-top:4px">${all ? 'Show fewer' : `Show all ${ls.length} (+ ${ls.length - shown.length} more)`}</button>` : ''}</div>`;
  }).join('');
  return `<div class="top"><div><h1>Pipeline</h1><p>${open.length} open · ${gbp(sum(open, 'value'))} potential · drag cards between columns</p></div>
    <div class="acts"><button class="btn ghost" data-act="issuesJump">Real life issues ↓</button><button class="btn ghost" data-act="scripts">Message scripts</button><button class="btn" data-act="newLead">+ Add lead</button></div></div>
    ${followerGuide()}${bar2}<div class="card" style="margin-bottom:14px;padding-top:4px">${quickAdd()}
      <div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap"><input id="pipeSearch" type="search" value="${esc(pipeQ)}" placeholder="Search a name or @handle…" autocomplete="off" aria-label="Search the pipeline" style="flex:1;min-width:200px">${pipeQ.trim() ? `<span class="sub"><b style="color:var(--text)">${S.leads.filter(leadMatches).length}</b> match${S.leads.filter(leadMatches).length === 1 ? '' : 'es'}</span><button class="btn sm ghost" data-act="pipeClear">Clear</button>` : ''}</div></div><div class="kan">${cols}</div>${issuesCard()}`;
}
function card(l) {
  const isOpen = OPEN.includes(l.stage), sl = silent(l);
  return `<div class="lcard ${chaseLevel(l)}" draggable="true" data-lead="${l.id}" data-act="editLead" data-id="${l.id}">
    <div class="t"><b>${esc(l.name)}</b>${l.value || !isOpen ? `<span class="val">${gbp(l.value)}</span>` : '<span class="sub" style="white-space:nowrap">just a DM</span>'}</div>
    <div class="sub">${esc(l.handle || '')}${l.handle ? ' · ' : ''}${esc(l.source)}${l.offer ? ' · ' + esc(offerName(l.offer)) : ''}</div>
    <div class="m">${isOpen ? `<span class="chip ${sl >= S.settings.staleDays ? 'bad' : ''}">${sl === 0 ? 'contacted today' : sl + 'd silent'}</span>` : ''}
      ${l.nextFollowUp && isOpen ? `<span class="chip ${l.nextFollowUp < today() ? 'bad' : l.nextFollowUp === today() ? 'bad' : l.nextFollowUp === addDays(today(), 1) ? 'warn' : ''}">${l.nextFollowUp <= today() ? '🔴 follow up ' : 'follow up '}${rel(l.nextFollowUp)}</span>` : (isOpen && isStuck(l) ? '<span class="chip bad">🔴 no follow-up date</span>' : '')}
      ${l.stage === 'lost' && l.lostReason ? `<span class="chip bad">${esc(l.lostReason)}</span>` : ''}</div>
    ${isOpen ? `<div class="a"><button data-act="step" data-id="${l.id}" data-dir="-1" aria-label="Back a stage">‹</button><button class="ch ${chaseLevel(l) ? 'go' : ''}" data-act="chased" data-id="${l.id}">Chased</button><button data-act="step" data-id="${l.id}" data-dir="1" aria-label="Forward a stage">›</button></div>` : ''}</div>`;
}

/* ---------- CLIENTS ---------- */
function vClients() {
  const act = activeClients(), done = S.clients.filter(c => c.status !== 'active');
  const owed = sum(act, c => Math.max(0, c.price - clientPaid(c)));
  const tm = S.clients.filter(c => c.testimonial).length;
  const cardC = c => {
    const w = clientWeek(c), paid = clientPaid(c), end = addDays(c.start, 41);
    return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><div><b style="font:600 16px var(--head)">${esc(c.name)}</b><div class="sub">Started ${fdate(c.start)}</div></div>
      <div style="text-align:right">${c.health === 'risk' ? '<span class="chip bad">At risk</span>' : '<span class="chip good">On track</span>'}</div></div>
      <div class="weeks">${[1,2,3,4,5,6].map(i => `<i class="${i < w ? 'd' : i === w ? 'n' : ''}"></i>`).join('')}</div>
      <div class="sub">${w === 0 ? 'Starts ' + rel(c.start) : w > 6 ? 'Programme finished — mark as completed' : `Week ${w} of 6 · ends ${fdate(end)}`}</div>
      <div style="margin-top:12px;display:flex;justify-content:space-between"><span class="sub">Paid</span><b>${gbp(paid)} <span class="sub">/ ${gbp(c.price)}</span></b></div>${bar(paid / c.price * 100, paid >= c.price ? 'g' : '')}
      ${c.nextSession ? `<div class="sub" style="margin-top:10px">Next session: ${fdate(c.nextSession)} (${rel(c.nextSession)})</div>` : ''}
      ${c.notes ? `<div class="sub" style="margin-top:6px;color:var(--text)">${esc(c.notes)}</div>` : ''}
      <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">${c.testimonial ? '<span class="chip good">Testimonial ✓</span>' : ''}${c.upsell ? '<span class="chip warn">Upsell candidate</span>' : ''}<button class="btn sm ghost" style="margin-left:auto" data-act="editClient" data-id="${c.id}">Edit</button></div></div>`;
  };
  return `<div class="top"><div><h1>Clients</h1><p>${act.length} active · ${gbp(owed)} still to collect · ${tm} testimonial${tm === 1 ? '' : 's'} banked</p></div>
    <div class="acts"><button class="btn" data-act="newClient">+ Add client</button></div></div>
    ${act.length ? `<div class="cgrid">${act.map(cardC).join('')}</div>` : '<div class="card empty">No active clients yet. Win a lead in the pipeline, or add one manually.</div>'}
    ${done.length ? `<div class="sec" style="margin-top:28px">Past clients — your testimonials, referrals and next-offer list</div>
    <div class="card"><table><tr><th>Client</th><th>Started</th><th>Paid</th><th>Testimonial</th><th>Upsell</th><th></th></tr>
    ${done.map(c => `<tr><td><b>${esc(c.name)}</b></td><td>${fdate(c.start)}</td><td>${gbp(clientPaid(c))}</td><td>${c.testimonial ? '<span class="chip good">Yes</span>' : '<span class="chip">Not yet</span>'}</td><td>${c.upsell ? '<span class="chip warn">Yes</span>' : '—'}</td><td class="r"><button class="btn sm ghost" data-act="editClient" data-id="${c.id}">Edit</button></td></tr>`).join('')}</table></div>` : ''}`;
}

/* ---------- TASKS ---------- */
function vTasks() {
  const t = today();
  let ts = S.tasks.filter(x => taskFilter === 'All' || x.cat === taskFilter);
  const pend = ts.filter(x => !x.done);
  const byDue = (a, b) => a.due.localeCompare(b.due) || ['high','med','low'].indexOf(a.pri) - ['high','med','low'].indexOf(b.pri);
  const grp = [
    ['bad', 'Overdue', pend.filter(x => x.due && x.due < t).sort(byDue)],
    ['gold', 'Today', pend.filter(x => x.due === t)],
    ['', 'Upcoming', pend.filter(x => x.due > t).sort(byDue)],
    ['', 'Someday', pend.filter(x => !x.due)],
    ['', 'Done recently', ts.filter(x => x.done).sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || '')).slice(0, 8)],
  ];
  return `<div class="top"><div><h1>To-do</h1><p>${S.tasks.filter(x => !x.done).length} open tasks</p></div>

/* ---------- MONEY (in + out) ---------- */
let spendMode = 'everyday';
const isBillPay = e => !!e.billId || e.cat === 'Bills';
const billPaid = b => S.expenses.some(e => e.billId === b.id && e.date.startsWith(monthKey()));
const spendDay = (d, all) => sum(S.expenses.filter(e => e.date === d && (all || !isBillPay(e))), 'amount');
const ord = n => n + ([11, 12, 13].includes(n) ? 'th' : ({1:'st', 2:'nd', 3:'rd'}[n % 10] || 'th'));

function vRevenue() {
  const st = S.settings, ym = monthKey(), t = today();
  const rev = monthRev(ym), last = monthRev(monthKey(-1)), otherIn = monthOther(ym);
  const now = new Date(), dom = now.getDate(), dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const proj = rev / dom * dim;
  const monthExp = S.expenses.filter(e => e.date.startsWith(ym));
  const out = sum(monthExp, 'amount'), totalIn = rev + otherIn, net = totalIn - out;
  const everyday = sum(monthExp.filter(e => !isBillPay(e)), 'amount'), avg = everyday / dom;
  const unpaid = S.bills.filter(b => !billPaid(b)), unpaidSum = sum(unpaid, 'amount'), billsTotal = sum(S.bills, 'amount'), incomeTotal = sum(S.income, 'amount');

  /* revenue chart */
  const months = [-5,-4,-3,-2,-1,0].map(o => { const k = monthKey(o); return {k, v:monthRev(k)}; });
  const mx = Math.max(st.target, ...months.map(m => m.v)) * 1.08;
  const pays = [...S.payments].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8);

  /* daily spending chart (last 30 days) */
  const all = spendMode === 'all';
  const days = [...Array(30)].map((_, i) => addDays(t, i - 29));
  const vals = days.map(d => spendDay(d, all));
  const avg7 = vals.map((_, i) => { const w = vals.slice(Math.max(0, i - 6), i + 1); return w.reduce((a, b) => a + b, 0) / w.length; });
  const smx = Math.max(...vals, ...avg7, 1) * 1.1;
  const wk = sum(vals.slice(23), x => x), prev = sum(vals.slice(16, 23), x => x);
  const pct = prev ? Math.round((wk - prev) / prev * 100) : null;
  const trend = pct === null ? 'Not enough data yet to compare weeks.' : pct > 0 ? `<span class="chip warn">▲ ${pct}% more</span> than the week before` : pct < 0 ? `<span class="chip good">▼ ${-pct}% less</span> than the week before` : 'Same as the week before';
  const pts = avg7.map((v, i) => `${((i + .5) / 30 * 100).toFixed(2)},${(100 - v / smx * 100).toFixed(2)}`).join(' ');

  /* category split */
  const byCat = {}; monthExp.forEach(e => { byCat[e.cat] = (byCat[e.cat] || 0) + e.amount; });
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);

  /* bills */
  const billRow = b => {
    const paid = billPaid(b), due = `${ym}-${pad(Math.min(b.day, dim))}`, dd = diff(t, due);
    const chip = paid ? '<span class="chip good">Paid ✓</span>' : dd < 0 ? `<span class="chip bad">${-dd} days overdue</span>` : dd <= 3 ? `<span class="chip warn">due ${rel(due)}</span>` : `<span class="chip">due in ${dd} days</span>`;
    return `<div class="row"><div class="grow"><b>${esc(b.name)}</b><div class="sub">${gbp(b.amount)} · ${ord(b.day)} of each month</div></div>${chip}
      <button class="btn sm ${paid ? 'ghost' : 'good'}" data-act="billPay" data-id="${b.id}">${paid ? 'Undo' : 'Mark paid'}</button>
      <button class="btn sm ghost" data-act="editBill" data-id="${b.id}">Edit</button></div>`;
  };

  const incomeRow = i => {
    const got = incomeReceived(i), due = `${ym}-${pad(Math.min(i.day, dim))}`, dd = diff(t, due);
    const chip = got ? '<span class="chip good">Received ✓</span>' : dd < 0 ? `<span class="chip warn">${-dd} days late</span>` : `<span class="chip">expected ${dd === 0 ? 'today' : 'in ' + dd + ' days'}</span>`;
    return `<div class="row"><div class="grow"><b>${esc(i.name)}</b><div class="sub">${gbp(i.amount)} · ${ord(i.day)} of each month</div></div>${chip}
      <button class="btn sm ${got ? 'ghost' : 'good'}" data-act="incomePay" data-id="${i.id}">${got ? 'Undo' : 'Mark received'}</button>
      <button class="btn sm ghost" data-act="editIncome" data-id="${i.id}">Edit</button></div>`;
  };
  const incomeCard = `<div class="card"><h2>Other income <small>${gbp(incomeTotal)} / month · rental, etc.</small></h2>
    ${S.income.map(incomeRow).join('') || '<div class="empty">Add rental or other regular income.</div>'}
    <div style="margin-top:10px"><button class="btn sm ghost" data-act="newIncome">+ Add income</button></div></div>`;
  return `<div class="top"><div><h1>Money</h1><p>Everything coming in, everything going out, and where it's heading.</p></div>
    <div class="acts"><button class="btn" data-act="newPayment">+ Money in</button><button class="btn ghost" data-act="newExpense">+ Money out</button><button class="btn ghost" data-act="newBill">+ Bill</button></div></div>
  <div class="kpis">
    <div class="kpi"><div class="l">Money in · ${mname(ym)}</div><div class="v">${gbp(totalIn)}</div><div class="s">${otherIn ? `business ${gbp(rev)} + other ${gbp(otherIn)}<br>` : ''}${Math.round(rev / st.target * 100)}% of ${gbp(st.target)} business target</div>${bar(rev / st.target * 100)}</div>
    <div class="kpi"><div class="l">Money out · ${mname(ym)}</div><div class="v">${gbp(out)}</div><div class="s">${monthExp.length} payments</div></div>
    <div class="kpi ${net < 0 ? 'alert' : ''}"><div class="l">Left over this month</div><div class="v" style="${net >= 0 ? 'color:var(--good)' : ''}">${gbp(net)}</div><div class="s">${net >= 0 ? 'in profit' : 'spending more than you earn'}</div></div>
    <div class="kpi"><div class="l">Total bills / month</div><div class="v">${gbp(billsTotal)}</div><div class="s">${S.bills.length} bills · about ${gbp(billsTotal / dim)} a day</div></div>
    <div class="kpi"><div class="l">Other income / month</div><div class="v">${gbp(incomeTotal)}</div><div class="s">${incomeTotal ? `covers ${Math.round(incomeTotal / Math.max(1, billsTotal) * 100)}% of your bills` : 'rental etc. · add it below'}</div></div>
    <div class="kpi"><div class="l">Bills still to pay</div><div class="v">${gbp(unpaidSum)}</div><div class="s">${unpaid.length} of ${S.bills.length} bills not paid yet</div></div>
    <div class="kpi"><div class="l">Average daily spend</div><div class="v">${gbp(avg)}</div><div class="s">${gbp(avg * dim)} on pace for the month</div></div>
    <div class="kpi"><div class="l">Income on pace for</div><div class="v">${gbp(proj)}</div><div class="s">${last ? 'last month ' + gbp(last) : 'at today’s run rate'}</div></div>
  </div>

  <div class="sec gold">Money in</div>
  <div class="grid" style="margin-top:8px">
    <div class="card"><h2>Business income, last 6 months <small>dashed line = ${gbp(st.target)}/month target</small></h2>
      <div class="chart"><div class="tl" style="bottom:${st.target / mx * (210 - 26)}px"><span>Target</span></div>
      ${months.map((m, i) => `<div class="col ${i === 5 ? 'cur' : ''}" title="${mname(m.k)}: ${gbp(m.v)}"><b>${gbp(m.v)}</b><i style="height:${m.v / mx * (210 - 54)}px"></i></div>`).join('')}</div>
      <div class="xl">${months.map(m => `<span>${mname(m.k)}</span>`).join('')}</div></div>
    <div class="stack"><div class="card"><h2>Latest payments in</h2>${pays.length ? `<table>${pays.map(p => `<tr><td><b>${esc(p.who)}</b><div class="sub">${fdate(p.date)}${p.kind === 'other' ? ' · Other income' : ''}${p.note ? ' · ' + esc(p.note) : ''}${p.offer && p.offer !== '' && !(p.note || '').includes(offerName(p.offer)) ? ' · ' + esc(offerName(p.offer)) : ''}</div></td><td class="r val">${gbp(p.amount)}</td><td class="r"><button class="x" data-act="delPay" data-id="${p.id}" aria-label="Delete payment">×</button></td></tr>`).join('')}</table>` : '<div class="empty">No payments logged yet.</div>'}</div>
    ${incomeCard}</div>
  </div>

  <div class="sec" style="margin-top:26px">Money out</div>
  <div class="grid" style="margin-top:8px">
    <div class="card"><h2>Spending log <small>everything that leaves your account</small></h2>
      <form data-form="expense" class="inline" style="margin-bottom:12px">
        <input name="amount" type="number" min="0.01" step="0.01" placeholder="${CUR} amount" required style="flex:1;min-width:90px">
        <select name="cat">${EXP_CATS.map(c => `<option>${c}</option>`).join('')}</select>
        <input name="note" placeholder="What was it?" style="flex:2;min-width:130px">
        <input name="date" type="date" value="${t}">
        <button class="btn">Add</button></form>
      ${S.expenses.length ? `<table>${[...S.expenses].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 14).map(e => `<tr><td>${fdate(e.date)}</td><td><span class="chip">${esc(e.cat)}</span></td><td class="sub">${esc(e.note || '')}</td><td class="r"><b>${gbp(e.amount)}</b></td><td class="r"><button class="x" data-act="delExp" data-id="${e.id}" aria-label="Delete">×</button></td></tr>`).join('')}</table>` : '<div class="empty">Nothing logged yet. Log every pound that goes out.</div>'}</div>
    <div class="stack">
      <div class="card"><h2>Monthly bills <small>${gbp(sum(S.bills, 'amount'))} / month · ${gbp(unpaidSum)} left to pay</small></h2>
        ${S.bills.length ? `<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:6px"><div><div class="sub">Total every month</div><div style="font:600 30px var(--head);letter-spacing:-.02em">${gbp(billsTotal)}</div></div><div style="text-align:right"><div class="sub">Paid this month <b style="color:var(--good)">${gbp(billsTotal - unpaidSum)}</b></div><div class="sub">Still to pay <b style="color:var(--text)">${gbp(unpaidSum)}</b></div></div></div>${bar(billsTotal ? (billsTotal - unpaidSum) / billsTotal * 100 : 0, unpaidSum === 0 ? 'g' : '')}<div style="height:6px"></div>` : ''}
        ${[...S.bills].sort((a, b) => a.day - b.day).map(billRow).join('') || '<div class="empty">Add your recurring bills: rent, software, phone…</div>'}
        <div style="margin-top:10px"><button class="btn sm ghost" data-act="newBill">+ Add bill</button></div></div>
      <div class="card"><h2>Where it went <small>${mname(ym)} so far</small></h2>
        ${cats.length ? cats.map(([c, v]) => `<div class="catrow"><span>${esc(c)}</span>${bar(v / cats[0][1] * 100)}<b style="text-align:right">${gbp(v)} <span class="sub">${Math.round(v / out * 100)}%</span></b></div>`).join('') : '<div class="empty">No spending this month.</div>'}</div>
    </div>
  </div>

  <div class="card" style="margin-top:16px"><h2>Daily spending, last 30 days
      <span class="seg"><button class="${!all ? 'on' : ''}" data-act="spendMode" data-m="everyday">Everyday spending</button><button class="${all ? 'on' : ''}" data-act="spendMode" data-m="all">Including bills</button></span></h2>
    <div class="sub">Last 7 days: <b style="color:var(--text)">${gbp(wk)}</b> · ${trend}</div>

/* ---------- PROOF ENGINE ---------- */
function vProof() {
  const st = S.settings, t = today();
  const from = proofRange ? addDays(t, -proofRange) : '0000-00-00';
  const ls = S.leads.filter(l => l.created >= from);
  const dms = sum(Object.entries(S.daily).filter(([d]) => d >= from), ([, v]) => v.dms);
  const steps = [
    ['DMs sent', dms],
    ['Leads in pipeline', ls.length],
    ['Replied to me', ls.filter(l => reached(l, 'replied')).length],
    ['Real conversations', ls.filter(l => reached(l, 'convo')).length],
    ['Calls booked', ls.filter(l => reached(l, 'booked')).length],
    ['Calls held', ls.filter(l => reached(l, 'decide')).length],
    ['Clients signed', ls.filter(l => l.stage === 'won').length],
  ];
  const top = Math.max(...steps.map(s => s[1]), 1);
  const rate = (a, b) => b ? Math.round(a / b * 100) : null;
  const won = ls.filter(l => l.stage === 'won');
  const cash = sum(S.payments.filter(p => isBiz(p) && p.date >= from), 'amount');
  const avgClose = won.length ? Math.round(sum(won, l => diff(l.created, l.wonDate || l.created)) / won.length) : 0;
  const callWin = rate(steps[5][1], steps[4][1]), overall = rate(steps[5][1], steps[2][1]);
  const rangeLbl = proofRange ? `the last ${proofRange} days` : 'all time';
  const srcRows = SOURCES.map(s => { const a = ls.filter(l => l.source === s), w = a.filter(l => l.stage === 'won'); return {s, n:a.length, w:w.length, v:sum(w, 'value')}; }).filter(r => r.n).sort((a, b) => b.v - a.v || b.n - a.n);
  /* readiness */
  const best = Math.max(0, ...[...Array(12)].map((_, i) => monthRev(monthKey(-i))));
  const dmDays = [...Array(14)].filter((_, i) => dayLog(addDays(t, -i)).dms >= st.dmTarget).length;
  const tm = S.clients.filter(c => c.testimonial).length;
  const checks = [
    ['Hit ' + gbp(st.target) + ' cash in a single month', best >= st.target, `Best month so far: ${gbp(best)}`, null],
    ['10 clients through the 6-week programme', S.clients.length >= 10, `${S.clients.length} / 10 clients`, null],
    ['5 testimonials or case studies banked', tm >= 5, `${tm} / 5`, null],
    ['Lead flow is repeatable (DM target hit 12 of last 14 days)', dmDays >= 12, `${dmDays} / 14 days`, null],
    ['System documented (scripts, SOPs, call framework)', !!S.proof.sop, 'Tap to tick off', 'sop'],
    ['Next offer written (outcome, price, structure)', !!S.proof.offer, 'Tap to tick off', 'offer'],
  ];
  const ready = checks.filter(c => c[1]).length;
  const story = steps[5][1] ? `In ${rangeLbl}, I sent <em>${dms.toLocaleString()}</em> DMs, held <em>${steps[4][1]}</em> calls and signed <em>${steps[5][1]}</em> clients${callWin !== null ? ` — a <em>${callWin}%</em> call-to-client rate` : ''}. That's <em>${gbp(cash)}</em> cash collected from a repeatable system.`
    : `Log your DMs and move leads through the pipeline. This page turns it into your proof: the exact numbers you'll show other coaches.`;
  return `<div class="top"><div><h1>Proof Engine</h1><p>The numbers that prove your system works — and your sales pitch to other coaches.</p></div>
    <div class="seg">${[[30,'30 days'],[90,'90 days'],[0,'All time']].map(([v, l]) => `<button class="${proofRange === v ? 'on' : ''}" data-act="range" data-v="${v}">${l}</button>`).join('')}</div></div>
  <div class="story">${story}</div>
  <div class="kpis">
    <div class="kpi"><div class="l">Call → client</div><div class="v">${callWin === null ? '—' : callWin + '%'}</div><div class="s">of calls held become clients</div></div>
    <div class="kpi"><div class="l">Convo → client</div><div class="v">${overall === null ? '—' : overall + '%'}</div><div class="s">of real conversations</div></div>
    <div class="kpi"><div class="l">Avg days to close</div><div class="v">${won.length ? avgClose : '—'}</div><div class="s">from first DM to signed</div></div>
    <div class="kpi"><div class="l">Cash collected</div><div class="v">${gbp(cash)}</div><div class="s">in ${rangeLbl}</div></div>
    <div class="kpi"><div class="l">DMs per client</div><div class="v">${steps[5][1] ? Math.round(dms / steps[5][1]) : '—'}</div><div class="s">your cost-in-effort per sale</div></div>
  </div>
  <div class="grid">
    <div class="stack">
      <div class="card funnel"><h2>Your funnel <small>${rangeLbl}</small></h2>
        ${steps.map(([label, n], i) => { const prev = i > 0 ? steps[i - 1][1] : null; const r = prev ? rate(n, prev) : null;
          return `<div class="f"><span>${label}</span><div class="bar"><i class="${i === 5 ? 'g' : ''}" style="width:${n / top * 100}%"></i></div><b style="text-align:right">${n.toLocaleString()}</b></div>${r !== null && i > 0 && i !== 1 ? `<div class="rate">↳ ${r}% move on to the next step</div>` : ''}`; }).join('')}</div>
      <div class="card"><h2>Where clients come from <small>${rangeLbl}</small></h2>${srcRows.length ? `<table><tr><th>Source</th><th class="r">Leads</th><th class="r">Won</th><th class="r">Win rate</th><th class="r">Revenue</th></tr>
        ${srcRows.map(r => `<tr><td><b>${r.s}</b></td><td class="r">${r.n}</td><td class="r">${r.w}</td><td class="r">${rate(r.w, r.n)}%</td><td class="r val">${gbp(r.v)}</td></tr>`).join('')}</table>` : '<div class="empty">No leads in this range.</div>'}</div>
    </div>
    <div class="stack">
      <div class="card"><h2>Ready to launch the next offer? <small>${ready} / ${checks.length}</small></h2>
        ${checks.map(([label, ok, detail, key]) => `<${key ? 'button data-act="proofToggle" data-k="' + key + '"' : 'div'} class="rd"><span class="ico ${ok ? 'ok' : ''}">${ok ? '✓' : ''}</span><span style="flex:1"><b>${label}</b><div class="sub">${detail}</div></span></${key ? 'button' : 'div'}>`).join('')}
        ${bar(ready / checks.length * 100, ready === checks.length ? 'g' : '')}</div>
      <div class="card"><h2>Your roadmap</h2><div style="display:flex;gap:12px;flex-wrap:wrap">
        <div class="phase ${ready < checks.length ? 'cur' : ''}"><small>Phase 1 · Prove it</small><p style="margin-top:4px"><b>6-week Life Coaching Mentorship</b></p><p class="sub">Hit ${gbp(st.target)}/month, bank the proof, document the system.</p></div>
        <div class="phase ${ready === checks.length ? 'cur' : ''}"><small>Phase 2 · Scale it</small><p style="margin-top:4px"><b>${esc(st.nextOffer)}</b></p><p class="sub">“2027 is your last chance to scale before the market saturates.” Launch backed by your own numbers.</p></div></div></div>
    </div>
  </div>`;
}

/* ================= actions ================= */
function applyStage(l, stage) {
  const t = today();
  l.stage = stage; l.history.push({stage, date:t}); l.lastContact = t;
  if (OPEN.includes(stage) && !l.nextFollowUp) l.nextFollowUp = noSun(addDays(t, S.settings.gap));
}
function moveLead(id, stage, ask = true) {
  const l = S.leads.find(x => x.id === id); if (!l || l.stage === stage) return;
  if (stage === 'won') return winForm(id);
  if (stage === 'lost') return lostForm(id);
  applyStage(l, stage); l.lostReason = ''; save(); render();
  if (ask && ORDER.indexOf(stage) >= ORDER.indexOf('convo') && !l.offer) { toast('Which offer are you talking about? Pick it and the value fills in.'); leadForm(id); }   // they were just a DM until now
}
function toggleTask(id) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  t.done = !t.done; t.doneAt = t.done ? today() : '';
  if (t.done && t.repeat) {
    const step = t.repeat === 'daily' ? 1 : 7;
    const base = t.due && t.due > today() ? t.due : today();
    if (!S.tasks.some(x => !x.done && x.title === t.title && x.repeat === t.repeat)) S.tasks.push({...t, id:uid(), done:false, doneAt:'', due:t.repeat === 'daily' ? noSun(addDays(base, step)) : addDays(base, step)});
  }
  save(); render();
}

  const f = e.target.closest && e.target.closest('form[data-form]');
  if (!f || !e.target.name || e.target.type === 'hidden' || e.target.type === 'file') return;
  const k = formKey(f); drafts[k] = drafts[k] || {};
  drafts[k][e.target.name] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  saveDrafts();
});
function restoreDrafts(root) {
  root.querySelectorAll('form[data-form]').forEach(f => {
    const d = drafts[formKey(f)]; if (!d) return;
    for (const [n, v] of Object.entries(d)) {
      const el = f.elements[n]; if (!el || el.type === 'hidden' || el.length) continue;
      if (el.type === 'checkbox') el.checked = v; else el.value = v;
    }
  });
}
/* remember which pop-up is open, so a refresh reopens it with your text still in it */
['leadForm','scaleEditForm','icpForm','clientForm','payForm','expenseForm','billForm','goalForm','incomeForm','identityForm','missionForm','dayForm','winForm','lostForm'].forEach(name => {
  const orig = window[name];
  window[name] = function (id) { drafts.__modal = {name, id}; saveDrafts(); return orig(id); };
});
function saveUI() { try { localStorage.setItem(UI_KEY, JSON.stringify({view, taskFilter, proofRange, spendMode, folded, scaleTab, scalePillar, pipeGuide, pipeIssues})); } catch (e) {} }
function loadUI() {
  let ui = {}; try { ui = JSON.parse(localStorage.getItem(UI_KEY)) || {}; } catch (e) {}
  if (!location.hash && NAV.some(n => n[0] === ui.view)) view = ui.view;
  if (typeof ui.taskFilter === 'string' && ['All', ...CATS].includes(ui.taskFilter)) taskFilter = ui.taskFilter;
  if ([0, 30, 90].includes(ui.proofRange)) proofRange = ui.proofRange;
  if (ui.spendMode === 'all' || ui.spendMode === 'everyday') spendMode = ui.spendMode;
  if (['journal', 'pillars', 'playbook'].includes(ui.scaleTab)) scaleTab = ui.scaleTab;
  if (PILLARS.some(p => p.id === ui.scalePillar)) scalePillar = ui.scalePillar;
  if (typeof ui.pipeGuide === 'boolean') pipeGuide = ui.pipeGuide;
  if (typeof ui.pipeIssues === 'boolean') pipeIssues = ui.pipeIssues;
  if (ui.folded && typeof ui.folded === 'object') folded = {identity: !!ui.folded.identity, mission: !!ui.folded.mission};
}
let scrollT;
window.addEventListener('scroll', () => { clearTimeout(scrollT); scrollT = setTimeout(() => { try { sessionStorage.setItem('coachos.scroll', JSON.stringify({view, y:scrollY})); } catch (e) {} }, 150); }, {passive:true});
window.addEventListener('pagehide', save);
/* if the dashboard is open in two tabs, the other tab's changes show up here instead of being overwritten */
window.addEventListener('storage', e => { if (e.key === KEY && e.newValue) { try { S = migrate(JSON.parse(e.newValue)); render(); } catch (x) {} } });

document.addEventListener('change', e => {
  const t = e.target; if (!t || (t.name !== 'offer' && t.name !== 'kind' && t.name !== 'freq')) return;
  const f = t.closest('form'); if (!f) return;
  const fire = el => el && el.dispatchEvent(new Event('input', {bubbles:true}));
  if (t.name === 'kind') {   // coaching sale vs other income
    if (f.dataset.form !== 'payment') return;
    if (t.value === 'other') { closeModal(); incomeForm(); }
    return;
  }
  if (t.name === 'freq') {   // monthly shows the day, one-off shows the date
    f.querySelectorAll('[data-when]').forEach(d => { d.hidden = d.dataset.when !== t.value; });
    return;
  }
  if (f.dataset.form === 'lead' && f.elements.value) { f.elements.value.value = t.value ? offerPrice(t.value) : 0; fire(f.elements.value); }
  if (f.dataset.form === 'payment') {
    if (t.value && f.elements.amount) { f.elements.amount.value = offerPrice(t.value); fire(f.elements.amount); }
    if (f.elements.counts) { f.elements.counts.checked = !!t.value; fire(f.elements.counts); }
  }
});

document.addEventListener('input', e => {   // Scale Notes boxes save as you type
  const d = e.target.dataset; if (!d) return;
  if (d.tmpl !== undefined) { S.tmplEdits[TEMPLATES[+d.tmpl][0]] = e.target.value; save(); }
  else if (d.icp) { S.icp.lists[d.icp] = e.target.value.split(/\r?\n/).map(x => x.trim()).filter(Boolean); save(); }
  else if (d.uq) { const [pp, kk] = d.uq.split(':'); const lw = S.scale.ladder[pp]; lw.uq[kk] = e.target.value; lw.understand = composeUnderstand(pp); const cc = document.getElementById('uqc-' + pp); if (cc) cc.textContent = uqCount(pp); save(); }
  else if (d.ufree) { const lw = S.scale.ladder[d.ufree]; lw.ufree = e.target.value; lw.understand = composeUnderstand(d.ufree); save(); }
  else if (d.aiq) { const [pp, ii] = d.aiq.split(':'); const st = aiState[pp] = aiState[pp] || {}; st.ans = st.ans || []; st.ans[+ii] = e.target.value; }
  else if (d.imp) { drafts.__imp = drafts.__imp || {}; drafts.__imp[d.imp] = e.target.value; saveDrafts(); }
  else if (d.lad) { const [p, k] = d.lad.split(':'); S.scale.ladder[p][k] = e.target.value; save(); }
  else if (d.sq) { const [p, i] = d.sq.split(':'); S.scale.answers[p][+i] = e.target.value; save(); }
  else if (d.spb) { S.scale.playbook[d.spb] = e.target.value; save(); }
  else if (d.swk) { const [n, k] = d.swk.split(':'); (S.scale.weeks[n] = S.scale.weeks[n] || {})[k] = e.target.value; save(); }
});
document.addEventListener('input', e => {
  const el = e.target, id = el.dataset && el.dataset.nnTitle; if (!id) return;
  const n = S.nonneg.find(x => x.id === id); if (n) { n.title = el.value; save(); }   // saved as you type
});
document.addEventListener('change', e => {
  const el = e.target, id = el.dataset && el.dataset.nnTitle; if (!id) return;
  const n = S.nonneg.find(x => x.id === id); if (!n) return;
  if (!el.value.trim()) { n.title = el.defaultValue || 'Untitled'; save(); toast('A non-negotiable needs a name'); render(); }
  else { n.title = el.value.trim(); save(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.nnTitle) e.target.blur(); });
let nnDragId = null;
const nnRow = e => e.target.closest && e.target.closest('.row[data-nn]');
document.addEventListener('dragstart', e => { const r = nnRow(e); if (!r) return; nnDragId = r.dataset.nn; r.classList.add('dragging'); try { e.dataTransfer.setDragImage(r, 12, 12); } catch (x) {} e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', nnDragId); });
document.addEventListener('dragover', e => { const r = nnRow(e); if (r && nnDragId) { e.preventDefault(); document.querySelectorAll('.row.dropover').forEach(x => x !== r && x.classList.remove('dropover')); r.classList.add('dropover'); } });
document.addEventListener('drop', e => {
  const r = nnRow(e); if (!r || !nnDragId) return;
  e.preventDefault();
  const from = S.nonneg.findIndex(x => x.id === nnDragId), to = S.nonneg.findIndex(x => x.id === r.dataset.nn);
  nnDragId = null;
  if (from >= 0 && to >= 0 && from !== to) { const [it] = S.nonneg.splice(from, 1); S.nonneg.splice(to, 0, it); save(); }
  render();
});
document.addEventListener('dragend', () => { nnDragId = null; document.querySelectorAll('.row.dragging,.row.dropover').forEach(x => x.classList.remove('dragging', 'dropover')); });

/* import backup */
document.addEventListener('change', e => {
  if (e.target.id !== 'importFile' || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => { try { const o = JSON.parse(r.result); if (!Array.isArray(o.leads)) throw 0; S = migrate(o); save(); render(); toast('Backup restored'); } catch (x) { toast('That file is not a valid backup'); } };
  r.readAsText(e.target.files[0]);
});
window.addEventListener('hashchange', () => { const v = location.hash.replace('#', '').replace('followups', 'pipeline'); if (NAV.some(n => n[0] === v) && v !== view) { view = v; render(); } });
document.title = S.settings.bizName + ' — Command Centre';
loadUI();
render();
try { /* put the scroll position back after a refresh */
  const sc = JSON.parse(sessionStorage.getItem('coachos.scroll') || 'null');
  if (sc && sc.view === view) window.scrollTo(0, sc.y);
} catch (e) {}
if (drafts.__modal) { /* reopen the pop-up you were in the middle of */
  try { const m = drafts.__modal; window[m.name](m.id); } catch (e) { delete drafts.__modal; saveDrafts(); $('#modal').innerHTML = ''; }
}
try { if (localStorage.getItem(KEY) === null) save(); } catch (e) {} // first ever open: store it straight away
</script>
</body>
</html>
